[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gradientsio"
version = "0.1.2"
description = "Python SDK for Gradients.io training jobs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Gradients.io", email = "gradientsio@outlook.com" }]
dependencies = [
    "accelerate==1.11.0",
    "datasets==2.21.0",
    "huggingface-hub==0.36.0",
    "httpx>=0.27.0,<1.0.0",
    "peft==0.17.1",
    "pydantic>=2.0.0,<3.0.0",
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "torchvision==0.24.1",
    "transformers==4.57.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.8",
]

[project.urls]
Homepage = "https://gradients.io"
Documentation = "https://api.gradients.io/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/gradientsio"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
force-single-line = true
lines-after-imports = 2
