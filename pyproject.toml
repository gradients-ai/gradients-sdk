[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gradients-sdk"
version = "0.1.0"
description = "Python SDK for Gradients.io training jobs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Gradients.io", email = "gradientsio@outlook.com" }]
dependencies = [
    "httpx>=0.27.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "respx>=0.21.0",
    "ruff>=0.6.8",
]

[project.urls]
Homepage = "https://gradients.io"
Documentation = "https://api.gradients.io/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/gradients"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
force-single-line = true
lines-after-imports = 2

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
